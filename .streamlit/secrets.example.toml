# Merge these sections into your existing .streamlit/secrets.toml.

[google_drive]
# Use the Desktop app OAuth client previously stored in credentials.json.
# Separate from the Web application client used for app sign-in below.
client_id = "YOUR_DESKTOP_CLIENT_ID.apps.googleusercontent.com"
client_secret = "YOUR_DESKTOP_CLIENT_SECRET"

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_A_RANDOM_SECRET"

[auth.google]
client_id = "REPLACE_WITH_GOOGLE_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access]
# Every listed account has full administrator access.
approved_emails = ["admin@example.com"]
